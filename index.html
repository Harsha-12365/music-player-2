<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="music-player">
            <div class="player-header">
                <input type="text" id="searchInput" placeholder="Search songs...">
                <select id="categoryFilter">
                    <option value="all">All Genres</option>
                    <option value="pop">Pop</option>
                    <option value="rock">Rock</option>
                    <option value="jazz">Jazz</option>
                    <option value="classical">Classical</option>
                </select>
            </div>
            
            <div class="player-main">
                <div class="current-song-info">
                    <img id="albumArt" src="/api/placeholder/300/300" alt="Album Art">
                    <h2 id="songTitle">No song selected</h2>
                    <p id="artistName">-</p>
                </div>
                
                <div class="controls">
                    <div class="progress-container">
                        <span id="currentTime">0:00</span>
                        <div class="progress-bar">
                            <div class="progress"></div>
                        </div>
                        <span id="duration">0:00</span>
                    </div>
                    
                    <div class="buttons">
                        <button id="prevBtn"><i class="fas fa-backward"></i></button>
                        <button id="playPauseBtn"><i class="fas fa-play"></i></button>
                        <button id="nextBtn"><i class="fas fa-forward"></i></button>
                        <div class="volume-control">
                            <i class="fas fa-volume-up"></i>
                            <input type="range" id="volumeSlider" min="0" max="100" value="100">
                        </div>
                    </div>
                </div>
            </div>

            <div class="playlist">
                <h3>Playlist</h3>
                <ul id="playlistItems">
                    <!-- Playlist items will be added here dynamically -->
                </ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
